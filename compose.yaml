services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_VERBOSITY: ${TELEGRAM_API_VERBOSITY:-1}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - bot-network

  bot:
    image: ${WATERMARKER_IMAGE:-tg-watermarker:latest}
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    user: "101:101"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_BOT_API_URL: http://telegram-bot-api:8081/bot
      TELEGRAM_LOCAL_MODE: "true"
      SIGNATURE_IMAGE_DIR: ${SIGNATURE_IMAGE_DIR:-/app/assets}
      SIGNATURE_IMAGE_FILE: ${SIGNATURE_IMAGE_FILE:-signature.png}
      JPEG_QUALITY: ${JPEG_QUALITY:-95}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      FILE_TRANSFER_TIMEOUT_SECONDS: ${FILE_TRANSFER_TIMEOUT_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    networks:
      - bot-network

volumes:
  telegram-bot-api-data:

networks:
  bot-network:
    driver: bridge
